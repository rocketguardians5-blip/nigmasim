[project]
name = "nigmasim-capture-worker"
version = "0.1.0"
description = "NigmaSim Capture Worker - Playwright + Chromium, proses terpisah"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "playwright==1.49.1",
    "pillow==11.0.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["browser", "main", "masking", "config", "detector", "win_session"]
